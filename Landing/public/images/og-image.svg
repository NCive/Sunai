  </text>
  <text x="600" y="390" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="18" fill="#A3C8BF" letter-spacing="0.02em">
    Timing-First Voice AI Running Locally on a 16 GB Laptop
  </text>
  
  <!-- Decision Dots -->
  <circle cx="510" cy="460" r="7" fill="#2FD3A5" />
  <text x="528" y="466" font-family="'Inter', sans-serif" font-size="15" fill="#D1E8E2">Resume</text>
  
  <circle cx="630" cy="460" r="7" fill="#FF6A5C" />
